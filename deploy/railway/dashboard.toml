# Railway service: Plotly Dash analyst dashboard  (Config-as-code path: deploy/railway/dashboard.toml)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'gunicorn dashboard.app:server --bind 0.0.0.0:${PORT:-8050} --workers 2 --timeout 120'"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
