# Weekly data refresh for the public site (free: GitHub Actions + Vercel static hosting).
#   download sources -> bronze -> dbt build (all data tests must pass) -> forecasts/anomalies
#   -> export the API as a static JSON snapshot -> commit -> Vercel redeploys on the push.
# If any step fails, nothing is committed and the live site keeps serving the last good snapshot.
name: refresh-site

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/ingestion
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # optional: LLM-written market summaries
      ZENSUS_API_TOKEN: ${{ secrets.ZENSUS_API_TOKEN }} # optional: refresh Zensus tables via API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest (downloads, falls back to committed raw files)
        run: python -m immodash_ingest
      - name: dbt build (silver + gold + data tests)
        working-directory: dbt
        run: dbt build
      - name: Forecasts and anomalies
        run: python -m ml
      - name: Export static snapshot for the site
        run: python scripts/export_static.py
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw web/public/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
