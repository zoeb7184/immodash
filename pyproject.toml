[project]
name = "immodash"
version = "0.1.0"
description = "German real estate market intelligence platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Query(...) defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["immodash_ingest", "api", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "ingestion"]

[tool.ruff.lint.per-file-ignores]
"scripts/report.py" = ["E501"]  # long lines are HTML/CSS template text
